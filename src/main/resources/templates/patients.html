<!DOCTYPE html>
<html>
<head>
<title>Patients</title>
</head>

<body>

<h1>Patient List</h1>

<table border="1">

<tr>
<th>ID</th>
<th>Name</th>
<th>Age</th>
<th>Disease</th>
<th>Contact</th>
</tr>

<tr th:each="patient : ${patients}">
<td th:text="${patient.id}"></td>
<td th:text="${patient.name}"></td>
<td th:text="${patient.age}"></td>
<td th:text="${patient.disease}"></td>
<td th:text="${patient.contact}"></td>
</tr>

</table>

</body>
</html>
